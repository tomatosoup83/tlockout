# TLockout goal templates
#
# goals-version is bumped when the catalogue format or shipped catalogue changes; the plugin
# upgrades older files itself (the previous file is saved as goals.yml.v<old version>.bak).
goals-version: 9
#
# Each 5x5 board draws 25 unique templates from this list, weighted by `weight`, subject to:
#   - `pool`: random (default) | custom-only (excluded from normal random board generation)
#   - `team-size`: any (default) | 2 | 2+
#   - `requires`: { biomes: [...], structures: [...] } (checked against world-scan in config.yml)
#   - `GoalGroups` anti-clustering caps & predecessor rules (so no single family floods a board)
#
# `id` must be unique. `display` and `icon` are optional - they are generated from
# the other fields when omitted.
#
# `variants` turns one template into several concrete board cells. The variants are chosen when
# the board is generated; `{name}` placeholders are substituted into display/requirement text
# (prettified) and item/icon names (uppercased).
#
# Types:
#   item         - item: MATERIAL, count: N            (have N of the item in inventory at once)
#   durability   - item: MATERIAL, remaining-percent: N (item at or below N% durability)
#   mob_kill     - entity: ENTITY_TYPE, count: N
#   player_kill  - count: N
#   biome        - biome: biome_name OR biomes: [biome_name, ...]
#   tame         - entity: ENTITY_TYPE
#   breed        - entity: ENTITY_TYPE, count: N
#   breed_unique - count: N (unique animal species bred across the team)
#   dimension    - dimension: NETHER | END | OVERWORLD
#   consume_item - item: MATERIAL, potion: POTION_TYPE (potion only when item is POTION)
#   unique_foods - count: N
#   advancement  - advancements: [NAMESPACED_KEY, ...]   (any one completes it)
#   advancement_count - count: N
#   status_effect - effect: POTION_EFFECT_TYPE
#   status_effect_count - count: N
#   milk_effect  - no params
#   death_by     - damage-type: KEY, entity: ENTITY_TYPE and/or special: VINES (at least one)
#   damage_total - mode: TAKEN | DEALT, amount: N
#   xp_level     - level: N
#   position     - mode: HEIGHT_LIMIT | BEDROCK | NETHER_ROOF
#   empty_hunger - no params
#   ride         - entity: ENTITY_TYPE
#   stat_counter - statistic: STATISTIC, amount: N, divisor: N (optional)
#   armor_set    - items: [MATERIAL, ...] OR mode: UNIQUE_DYED_LEATHER | ENCHANTED
#   armor_piece  - item: MATERIAL or items: [MATERIAL, ...], optional color: DYE_COLOR
#   armor_timer  - item: MATERIAL, seconds: N (cumulative wear time across the round)
#   wolf_armor   - no params (put wolf armor on a tamed wolf)
#   item_set     - items: [MATERIAL, ...], optional count: N (defaults to all items; team-wide)
#   unique_inventory - optional count: N (default 36; best single player)
#   mob_kill_total   - count: N (any N mobs killed across the team)
#   mob_kill_unique  - count: N (unique hostile mobs) OR entities: [ENTITY_TYPE, ...] (team set)
#   mob_kill_group   - entities: [ENTITY_TYPE, ...], count: N (total kills across matching mobs)
#   colored_sheep_kill - color: DYE_COLOR (kill a sheep of that wool colour)
#   opponent     - trigger: DEATH|DAMAGE_TAKEN|FALL_DAMAGE|CATCH_FIRE|TOUCH_WATER|OBTAIN_ITEM|EAT_FOOD|HIT_BY_EGG|HIT_BY_SNOWBALL
#   workstation  - station: ANVIL|CAULDRON|COMPOSTER|ENCHANTING_TABLE|GRINDSTONE|LOOM|SMITHING_TABLE|STONECUTTER
#   brew_potion  - potions: [POTION_TYPE, ...] OR mode: LINGERING
#   mine_block   - blocks: [MATERIAL, ...], optional count: N
#   block_action - action: USE_JUKEBOX|GLOW_INK_CRIMSON_SIGN|POT_FLOWER|FILL_ARMOR_STAND|
#                          ITEM_FRAME_IN_ITEM_FRAME|FILL_CAMPFIRE|FILL_CHISELED_BOOKSHELF|
#                          PLACE_END_CRYSTAL|LIGHT_CANDLE|SHOOT_FIREWORK_CROSSBOW|
#                          TOOT_GOAT_HORN|BRUSH_SUSPICIOUS_BLOCK|ANGER_ZOMBIFIED_PIGLIN|SHIELD_DISABLED
#   banner_shield - no params (hold a shield decorated with any banner)
#   conditional_kill - entity: ENTITY_TYPE, dimension: NETHER|END|OVERWORLD and/or damage-type: KEY

